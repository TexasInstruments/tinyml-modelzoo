################################################################################
# RADAR SURFACE CLASSIFICATION APPLICATION 
################################################################################

common:
  task_type: radar_surface_classification
  target_module: radar
  target_device: xWRL6432
  run_name: '{date-time}_{model_name}'

dataset:
  dataset_name: radar_surface_classification
  input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/radar_grass_surface_dataset.zip
  split_type: amongst_files
  split_factor: [0.7, 0.2, 0.1]

data_processing_feature_extraction:
   
  feature_extraction_name: Generic_130Input_Radar_RangeClassification

training:
  
  model_name: RF_MLP_4L_19K
  dataset_loader: GenericRadarDataset
  training_backend: tinyml_tinyverse
  quantization: 1
  quantization_method: "QAT"
  quantization_weight_bitwidth: 8       
  quantization_activation_bitwidth: 8            
  training_epochs: 100
  batch_size: 64
  num_classes: 2
  learning_rate: 0.0001
  optimizer: sgd
  num_gpus: 0
  training_device: cpu

testing: {}

compilation:
  compile_preset_name: "default_preset"