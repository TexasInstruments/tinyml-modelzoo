common:
  target_module: vision
  task_type: image_classification
  target_device: AM13E2
dataset:
  dataset_name: face_no_face_classification_balanced
  input_data_path: "/home/a0507182local/Face-Detector-1MB-with-landmark/face_no_face_combined_128x96"
data_processing_feature_extraction:
  augmentation_transform=: ["RANDOM_HORIZONTAL_FLIP","COLOR_JITTER"]
  variables: 3
  image_height: 96
  image_width: 128
  image_num_channel: 3
  image_mean: (0.485, 0.456, 0.406)
  image_scale: (0.229, 0.224, 0.225)
  color_jitter_brightness: 0.15
  color_jitter_contrast: 0.15
  color_jitter_saturation: 0.10
  color_jitter_hue: 0.02

training:
  model_name: MobileNetV1_58k_NPU
  batch_size: 30
  training_epochs: 200
  num_gpus: 1
  auto_quantization: True
  learning_rate: 0.1
testing: {}
compilation: {}
