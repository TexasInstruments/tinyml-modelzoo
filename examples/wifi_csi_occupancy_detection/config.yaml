common:
  task_type: generic_timeseries_classification
  target_device: F28P55
  run_name: '{date-time}/{model_name}'

dataset:
  dataset_name: wifi_csi_occupancy_detection
  # Point to the directory produced by preprocess.py
  input_data_path: /home/abhijeet/Downloads/wifi_csi_dataset

data_processing_feature_extraction:
  # --- Data proc transforms (applied to the full recording before framing) ---
  # Downsample: 128 Hz -> 64 Hz  (factor = sampling_rate / new_sr = 128 / 64 = 2)
  #   replicates the "remove odd indexes 256->128" step from the original pipeline
  # SimpleWindow: slice the downsampled recording into 128-sample (2 s) frames
  data_proc_transforms:
    - Downsample
    - SimpleWindow
  sampling_rate: 128          # native rate of the preprocessed .npy files (Hz)
  new_sr: 64                  # target rate after decimation (Hz)
  frame_size: 128             # samples per frame  (2 s × 64 Hz)
  stride_size: 0.7            # advance 70 % of frame per step → 30 % overlap

  # --- Feature extraction transforms (applied per frame, per variable) ---
  # L2_NORM_ROW  : row-wise L2 normalise each time step across all 52 subcarriers
  # FFT_FE       : real FFT along the time axis  (128 → 65 bins)
  # FFT_POS_HALF : keep positive-frequency half, drop Nyquist  (65 → 64 bins)
  # ABS          : magnitude of complex FFT output
  # LOG_DB       : log10(log_threshold + |F|)  → matches paper's log10(1 + |F|)
  # FFT_COL      : rFFT across the 52-subcarrier axis per window (52 → 26 bins)
  #                produces final (64, 26) 2-D feature map per window
  feat_ext_transform:
    - L2_NORM_ROW
    - FFT_FE
    - FFT_POS_HALF
    - ABS
    - LOG_DB
    - FFT_COL

  variables: 52               # 52 non-DC subcarriers (hw index 26 excluded by preprocess.py)
  feature_size_per_frame: 64  # FFT(128) → FFT_POS_HALF → 64 time-frequency bins
  num_frame_concat: 1         # single frame per sample; no temporal concatenation
  frame_skip: 1

  # Log transform parameters  (log10(1.0 + |F|) matches original paper)
  log_threshold: 1.0
  log_mul: 1
  log_base: 10
  offset: 0
  scale: 1

training:
  model_name: SimpleCNN2D_BN_t
  model_config: ''
  batch_size: 32
  training_epochs: 50
  num_gpus: 1
  learning_rate: 0.00005
  quantization: 0

testing: {}
compilation: {}
