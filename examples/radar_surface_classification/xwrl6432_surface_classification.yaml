################################################################################
# RADAR SURFACE CLASSIFICATION APPLICATION 
#
#
################################################################################

# ═══════════════════════════════════════════════════════════════════════════════
# COMMON SETTINGS - Task, Tensorlab AI Module, Device Identification
# ═══════════════════════════════════════════════════════════════════════════════

common:
  task_type: radar_surface_classification

  # Target module selects the AI module implementation (radar, vision, timeseries, audio)
  # This is common for all radar applications integrated within Tensorlab
  target_module: radar

  # Target radar device - determines compilation preset
  target_device: xWRL6432

  run_name: '{date-time}_{model_name}'

# ═══════════════════════════════════════════════════════════════════════════════
# DATASET CONFIGURATION - Data Source, Splitting, Paths
# ═══════════════════════════════════════════════════════════════════════════════

dataset:
  dataset_name: radar_surface_classification
  # NOTE: If your CSV column names don't match TI's capture tool convention
  # 

  input_data_path: https://software-dl.ti.com/C2000/esd/mcu_ai/datasets/radar_grass_surface_dataset.zip
  # Split strategy:
  #   - "within_files": Split each file internally (train/val/test from same file)
  #   - "amongst_files": Split by whole files (some files for train, some for test)
  split_type: amongst_files

  # Train/Validation/Test split ratios (must sum to 1.0)
  split_factor: [0.7, 0.2, 0.1]

# ═══════════════════════════════════════════════════════════════════════════════
# DATA PROCESSING & FEATURE EXTRACTION - 5-Stage Radar Pipeline
# ════════════════════════════════════════════════════════════════════════════════
#
# PIPELINE STAGES :
#   1. "Radar Range Data"       → Select FFT range bins (bin* columns)
#   2. "Radar Point Cloud Data" → Process point cloud detections
#   3. "Radar Track Data"       → Process track features + ghost track filter
#   4. "Scaling"                → Scale columns (independent!)
#   5. "Simple Window"          → Quality index + sliding window

data_processing_feature_extraction:
   
  feature_extraction_name: Generic_130Input_Radar_RangeClassification
  radar_feature_ordering: feature_major

# ═══════════════════════════════════════════════════════════════════════════════
# TRAINING CONFIGURATION - Model, Optimization, Hyperparameters
# ═══════════════════════════════════════════════════════════════════════════════

training:
  
  model_name: RF_MLP_4L_19K

  dataset_loader: GenericRadarDataset

  training_backend: tinyml_tinyverse

  # QUANTIZATION SETTINGS

  # Quantization mode:
  #   0 = NO_QUANTIZATION (FP32 float training) 
  #   1 = QUANTIZATION_GENERIC (generic quantization)
  quantization: 1
  
  # Quantization method (when quantization > 0):
  #   "QAT" = Quantization-Aware Training (recommended, 0-1% accuracy loss)
  #   "PTQ" = Post-Training Quantization (fast, 1-5% accuracy loss)
  quantization_method: "QAT"
  quantization_weight_bitwidth: 8       
  quantization_activation_bitwidth: 8   
  auto_quantization: false              


  # TRAINING HYPERPARAMETERS 

  training_epochs: 100

  # Early stopping - stops if no improvement for N epochs
  early_stopping: false
  early_stopping_patience: 5

  batch_size: 64
  num_classes: 2
  learning_rate: 0.0001
  optimizer: sgd

  # GPU count: 0 = CPU (default, portable), >0 = number of GPUs
  num_gpus: 0
  training_device: cpu

testing: {}

compilation:
  compile_preset_name: "default_preset"